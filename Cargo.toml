[package]
name = "slashpick"
version = "0.1.0"
edition = "2021"

[dependencies]
rdev = "0.5"     # global keyboard listener
enigo = "0.3"    # simulate backspace + typing the chosen icon
tao = "0.34"     # window
wry = "0.52"     # OS webview (renders emoji with the system's color emoji font)

[profile.release]
opt-level = 3
lto = true