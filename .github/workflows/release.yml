
name: Build and Release Pico

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pico for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Pico
        run: cargo build --release --locked

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico-windows-x64
          path: target/release/pico.exe

      - name: Upload executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" "target/release/pico.exe" --clobber
